plugins {
    id 'com.android.application'
}

// 签名密码不写入仓库：优先 local.properties（已 gitignore），其次环境变量
def localProps = new Properties()
def localPropsFile = rootProject.file('local.properties')
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { localProps.load(it) }
}
def releaseStorePassword =
        localProps.getProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
def releaseKeyPassword =
        localProps.getProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')

android {
    namespace 'com.nebulastrike.game'
    compileSdk 34

    defaultConfig {
        applicationId "com.nebulastrike.game"
        minSdk 21
        targetSdk 34
        versionCode 17
        versionName "1.14.0"
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    // 密钥库随仓库提供（个人项目）；密码从本地配置读取
    signingConfigs {
        release {
            storeFile rootProject.file('release.keystore')
            keyAlias 'nebulastrike'
            if (releaseStorePassword) storePassword releaseStorePassword
            if (releaseKeyPassword) keyPassword releaseKeyPassword
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseStorePassword && releaseKeyPassword) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    if (graph.hasTask(':app:assembleRelease') && (!releaseStorePassword || !releaseKeyPassword)) {
        throw new GradleException(
                '缺少签名密码：在 local.properties 或环境变量设置 RELEASE_STORE_PASSWORD / RELEASE_KEY_PASSWORD')
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
}
